<!doctype html>
<html>
  <body>
    <main>
      <h1>100 Example Ave</h1>
      <div id="monthly-section">
        <div class="required-group">
          <div class="fee-row">
            <span>Monthly base rent</span><span>$2,100</span>
          </div>
          <div class="fee-row">
            <span>Utility management fee</span><span>$0</span>
          </div>
        </div>
        <div class="optional-group">
          <div class="fee-row">
            <span>Pet Rent ($30 per pet, maximum two pets)</span><span>$0</span>
          </div>
        </div>
      </div>
      <div id="move-in-section">
        <div class="required-group">
          <div class="fee-row">
            <span>Application Fee ($55 per adult applicant)</span
            ><span>$55</span>
          </div>
        </div>
        <div class="optional-group">
          <div class="fee-row">
            <span>Pet Fee ($300 per pet; nonrefundable)</span><span>$0</span>
          </div>
        </div>
      </div>
      <p>
        A $55 application fee per applicant; a one-time $75 admin fee; an $11
        monthly utility management fee.
      </p>
    </main>
  </body>
</html>
